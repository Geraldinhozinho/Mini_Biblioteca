
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Autor</title>
    <link rel="stylesheet" href="{% static 'css/author_detail.css' %}">
</head>

<body>
    <h1>Detalhes do autor:</h1>
    <ul>
        <li>Nome: {{ Autor.name }}</li>
        <li>Nacionalidade: {{ Autor.nationality }}</li>
    </ul>

    <h2>Livros desse autor:</h2>

    <ul class="list">
        {% for livro in Livros %}
            <li class="list-item" >{{ livro.titulo }} <a class="bottons" href="{% url 'edit_book_author' livro.id Autor.id %}" >Editar livro</a></li>

        {% empty %}
            <li>Sem livros cadastrados.</li>
        {% endfor %}
    </ul>
    <a class="bottons_exit" href="{% url 'list_books' %}" >Voltar</a>  

</body>

</html>
