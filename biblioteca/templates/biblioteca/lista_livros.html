<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista livros</title>
</head>

<body>
    <h1>Listagem de Livros:</h1>
    <ul>
        {% for livro in Livros %} 
            <li><a href="{% url 'detail_author' livro.autor.id %}">{{ livro.autor }} - {{livro.titulo}}</a></li>
        {% endfor %}
    </ul>
</body>

</html>
