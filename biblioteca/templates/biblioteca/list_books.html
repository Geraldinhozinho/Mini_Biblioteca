{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista livros</title>
    <link rel="stylesheet" href="{% static 'css/list_books.css' %}">
</head>

<body>
    <h1>Listagem de Livros:</h1>
    <ul>
        {% for livro in Livros %}
        <li>
            {% for autor in livro.mul_autor.all %}
            <a href="{% url 'detail_author' autor.id %}">{{ autor.name }}</a>
                {% if not forloop.last %}
                ,
                {% endif %}
            </a>
            {% endfor %}
            - {{ livro.titulo }}
            <a class="bottons2" href="{% url 'edit_book' livro.id %}" >Editar livro</a>
        </li>
        {% endfor %}
    </ul>

    </ul>
    <div class="bottons-container">
        <a class="bottons" href="{% url 'create_author' %}">Cadastrar novo Autor</a>
        <a class="bottons" href="{% url 'create_book' %}">Cadastrar novo Livro</a>
    </div>
</body>

</html>
