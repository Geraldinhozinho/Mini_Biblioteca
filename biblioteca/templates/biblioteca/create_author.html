{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Autor</title>
    <link rel="stylesheet" href="{% static 'css/create_author.css' %}">
</head>

<body>
    <form method="post">
        {% csrf_token %}
        <div class="name">
            {{ form.name.label_tag }} 
            {{ form.name }}
            
            {% if form.name.errors %}
                <div style="color: tomato; ">{{ form.name.errors }}</div>
            {% endif %}
        </div>
        <div class="nationality">
            {{ form.nationality.label_tag }} 
            {{ form.nationality }}
            

            {% if form.nationality.errors %}
                <div style="color: tomato; ">{{ form.nationality.errors }}</div>
            {% endif %}
        </div>

        <div class="bottons-container">
            <button class="bottons" type="submit">Cadastrar</button>
            <a class="bottons_exit" href="{% url 'list_books' %}">Voltar</a>
        </div>

    </form>

</body>

</html>
