<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Autor</title>
</head>

<body>
    <h1>Detalhes do autor:</h1>
    <ul>
        <li>Nome: {{ Autor.name }}</li>
        <li>Nacionalidade: {{ Autor.nationality }}</li>
    </ul>

    <h2>Livros desse autor:</h2>

    <ul>
        {% for livro in Livros %}
            <li>{{ livro.titulo }} <a href="{% url 'edit_book' livro.id %}" >Editar livro</a></li>

        {% empty %}
            <li>Sem livros cadastrados.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'list_books' %}" >Voltar</a>  

</body>

</html>
